name: pyrun_injected

on:
  # Run on all branches except for the gh-pages branch
  push:
    paths-ignore:
      - '*.md'
    branches-ignore:
      - 'gh-pages'
    tags:
      - '*'

jobs:
  build_test:
    name: Build artefacts
    runs-on: Windows-latest
    strategy:
      matrix:
        python_version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        architecture: ['x86', 'x64']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python_version }}-${{ matrix.architecture }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python_version }}"
          architecture: "${{ matrix.architecture }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --all-groups --all-extras
      - name: Build Python ${{ matrix.python_version }}-${{ matrix.architecture }} wheel
        run: uv build
      - name: Lint and format code
        run: |
          uv run ruff check ./pyrun_injected ./tests
          uv run ruff format --check ./pyrun_injected ./tests
          uv run python -m twine check ./dist/*
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python_version }}-${{ matrix.architecture }}
          path: dist/
  release:
    name: Release pyrun-injected wheels and source build to PyPI
    # Only run this job if the commit was tagged.
    if: startsWith(github.ref, 'refs/tags')
    needs:
      - build_test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyrun-injected
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download files for release
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  test-release:
    name: Release pyrun-injected wheels and source build to test-PyPI
    # Release to the test PyPI if we have merged into master.
    if: (github.ref == 'refs/heads/master')
    needs:
      - build_test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyrun-injected
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download files for release
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
